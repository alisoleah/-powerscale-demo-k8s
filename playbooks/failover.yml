---
- name: EXECUTE TARGET FAILOVER - PowerScale SyncIQ
  hosts: all
  connection: local
  gather_facts: false

  vars:
    isilon_host: "{{ target_cluster | default(inventory_hostname) }}"
    policy_name: "{{ synciq_policy | default('NFS_Demo_Policy') }}"

  pre_tasks:
    - name: Ensure PowerScale Python SDK is installed in AWX runner
      ansible.builtin.pip:
        name: "isilon-sdk"
        state: present

  tasks:
    - name: 1. Confirm Target Cluster Connectivity
      dellemc.powerscale.info:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        gather_subset:
          - "cluster_identity"
      register: onefs_info

    - name: 2. Display Cluster Information
      debug:
        msg: "Successfully connected to Isilon at {{ isilon_host }}. Proceeding with SyncIQ failover sequence..."

    # ---------------------------------------------------------------
    # STEP 3: Promote target — POST directly to sync/jobs endpoint.
    # synciqpolicy with state:present skips job creation when policy
    # already exists, so we use uri to guarantee the job is triggered.
    # ---------------------------------------------------------------
    - name: 3. Execute SyncIQ Allow Write (Failover) on Policy
      ansible.builtin.uri:
        url: "https://{{ isilon_host }}:8080/platform/3/sync/jobs"
        method: POST
        user: "{{ ansible_user | default('root') }}"
        password: "{{ ansible_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          policy_name: "{{ policy_name }}"
          action: "allow_write"
        status_code: [200, 201, 202]
      register: allow_write_result

    - name: 3b. Wait for Allow Write job to complete
      ansible.builtin.uri:
        url: "https://{{ isilon_host }}:8080/platform/3/sync/jobs/{{ allow_write_result.json.id }}"
        method: GET
        user: "{{ ansible_user | default('root') }}"
        password: "{{ ansible_password }}"
        validate_certs: false
        force_basic_auth: true
        status_code: [200]
      register: job_status
      until: job_status.json.state in ['finished', 'failed', 'canceled']
      retries: 30
      delay: 10
      when: allow_write_result.json.id is defined

    # ---------------------------------------------------------------
    # STEP 4: Fence Site A — lock source READ-ONLY (SMB + NFS)
    # ---------------------------------------------------------------
    - name: 4a. Fence Site A - Lock SMB Share to Read-Only
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_A_Primary"
        path: "/ifs/data/source"
        description: "LOCKED - Site A is Read-Only during Failover"
        permissions:
          - permission: "read"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 4b. Fence Site A - Lock NFS Export to Read-Only
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/source"
        access_zone: "System"
        read_only: true
        root_clients:
          - "172.27.96.0/20"
        state: "present"

    # ---------------------------------------------------------------
    # STEP 5: Open Site B — make target READ-WRITE (SMB + NFS)
    # ---------------------------------------------------------------
    - name: 5a. Open Site B - Unlock SMB Share to Full Write
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_B_Recovery"
        path: "/ifs/data/target"
        description: "ACTIVE - Site B is the live target"
        permissions:
          - permission: "full"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 5b. Open Site B - Unlock NFS Export to Read-Write
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/target"
        access_zone: "System"
        read_only: false
        root_clients:
          - "172.27.96.0/20"
        state: "present"

    # ---------------------------------------------------------------
    # STEP 6: Final confirmation for demo audience
    # ---------------------------------------------------------------
    - name: 6. Confirm Failover Complete
      debug:
        msg:
          - "FAILOVER COMPLETE"
          - "Policy '{{ policy_name }}' → ALLOW_WRITE"
          - "Site A /ifs/data/source → READ-ONLY  (SMB + NFS locked)"
          - "Site B /ifs/data/target → READ-WRITE (SMB + NFS open)"
