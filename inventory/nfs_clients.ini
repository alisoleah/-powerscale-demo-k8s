# NFS Client Hosts - Edit this file to match your lab environment
# Then add these hosts to the "NFS Clients Inventory" in AWX
#
# FORMAT:
#   <hostname_or_alias>  ansible_host=<IP>
#
# EXAMPLE (replace with real client IPs):

[nfs_clients]
linux-client-1  ansible_host=192.168.1.10
linux-client-2  ansible_host=192.168.1.11

[nfs_clients:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa

# PowerScale NFS server IP (override per-host if needed)
nfs_server=192.168.243.50
