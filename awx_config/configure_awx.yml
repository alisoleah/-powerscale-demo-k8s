---
- name: Bootstrap AWX for PowerScale Demo
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - awx.awx

  vars:
    # --- UPDATE THESE 4 VARIABLES BEFORE RUNNING ---
    awx_host: "http://127.0.0.1:32825" 
    awx_password: "Kvkp8Xp1x7Z4usCQSLVCJ79lf1FIbk2J"
    isilon_password: "dell1234"
    controller_validate_certs: false
    github_repo: "https://github.com/alisoleah/-powerscale-demo-k8s.git"
    
    awx_username: "admin"

  tasks:
    - name: 1. Create PowerScale Machine Credential
      awx.awx.credential:
        name: "PowerScale_API_Creds"
        credential_type: "Machine"
        organization: "Default"
        inputs:
          username: "root"
          password: "{{ isilon_password }}"
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 2. Create Demo Inventory
      awx.awx.inventory:
        name: "PowerScale Demo Inventory"
        organization: "Default"
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 3. Add PowerScale Clusters to Inventory
      awx.awx.host:
        name: "192.168.243.50"
        inventory: "PowerScale Demo Inventory"
        variables:
          ansible_connection: local
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 4. Create GitHub Project for Payload
      awx.awx.project:
        name: "PowerScale Failover Playbooks"
        organization: "Default"
        scm_type: git
        scm_url: "{{ github_repo }}"
        scm_update_on_launch: true
        update_project: true
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 5. Create Failover Job Template
      awx.awx.job_template:
        name: "EXECUTE: Site A to Site B NFS Failover"
        job_type: run
        inventory: "PowerScale Demo Inventory"
        project: "PowerScale Failover Playbooks"
        playbook: "playbooks/failover.yml"
        credentials:
          - "PowerScale_API_Creds"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 6. Create Setup Job Template
      awx.awx.job_template:
        name: "SETUP: PowerScale Loopback Demo"
        job_type: run
        inventory: "PowerScale Demo Inventory"
        project: "PowerScale Failover Playbooks"
        playbook: "playbooks/setup_demo.yml"
        credentials:
          - "PowerScale_API_Creds"
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"

    - name: 7. Create Shares & Quotas Job Template
      awx.awx.job_template:
        name: "SETUP: PowerScale Shares and Quotas"
        job_type: run
        inventory: "PowerScale Demo Inventory"
        project: "PowerScale Failover Playbooks"
        playbook: "playbooks/configure_shares.yml"
        credentials:
          - "PowerScale_API_Creds"
        state: present
        controller_host: "{{ awx_host }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_password }}"
---