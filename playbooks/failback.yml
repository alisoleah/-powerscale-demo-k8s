---
- name: EXECUTE FAILBACK & RESTORE - PowerScale SyncIQ
  hosts: all
  connection: local
  gather_facts: false

  vars:
    isilon_host: "{{ target_cluster | default(inventory_hostname) }}"
    policy_name: "{{ synciq_policy | default('NFS_Demo_Policy') }}"

  pre_tasks:
    - name: Ensure PowerScale Python SDK is installed in AWX runner
      ansible.builtin.pip:
        name: "isilon-sdk"
        state: present

  tasks:
    # ---------------------------------------------------------------
    # STEP 1: Un-fence Site A — restore source to READ-WRITE (SMB + NFS)
    # ---------------------------------------------------------------
    - name: 1a. Un-Fence Site A - Restore SMB Share to Full Write
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_A_Primary"
        path: "/ifs/data/source"
        description: "Primary Windows Share (Active)"
        permissions:
          - permission: "full"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 1b. Un-Fence Site A - Restore NFS Export to Read-Write
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/source"
        access_zone: "System"
        read_only: false
        state: "present"

    # ---------------------------------------------------------------
    # STEP 2: Fence Site B — lock target back to READ-ONLY (SMB + NFS)
    # ---------------------------------------------------------------
    - name: 2a. Fence Site B - Lock SMB Share to Read-Only
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_B_Recovery"
        path: "/ifs/data/target"
        description: "Standby Windows Share (Read-Only until Failover)"
        permissions:
          - permission: "read"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 2b. Fence Site B - Lock NFS Export to Read-Only
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/target"
        access_zone: "System"
        read_only: true
        state: "present"

    # ---------------------------------------------------------------
    # STEP 3: resync_prep clears the Conflicted state left by allow_write
    # Policy may be auto-disabled after a failed job — re-enable first
    # ---------------------------------------------------------------
    - name: 3a. Enable SyncIQ policy (may be disabled after error state)
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        policy_name: "{{ policy_name }}"
        enabled: true
        state: "present"

    - name: 3b. SyncIQ Resync Prep (resolve conflicted state)
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        policy_name: "{{ policy_name }}"
        job_params:
          action: "resync_prep"
          wait_for_completion: true
        state: "present"

    # ---------------------------------------------------------------
    # STEP 4: Now safe to run the sync to re-mirror Site A → Site B
    # ---------------------------------------------------------------
    - name: 4. Re-establish SyncIQ Mirror (run sync)
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        policy_name: "{{ policy_name }}"
        job_params:
          action: "run"
          wait_for_completion: true
        state: "present"

    # ---------------------------------------------------------------
    # STEP 5: Final confirmation for demo audience
    # ---------------------------------------------------------------
    - name: 5. Confirm Failback Complete
      debug:
        msg:
          - "FAILBACK COMPLETE"
          - "Site A /ifs/data/source → READ-WRITE (Primary restored)"
          - "Site B /ifs/data/target → READ-ONLY  (Standby locked)"
          - "SyncIQ mirror re-established from Site A → Site B"
