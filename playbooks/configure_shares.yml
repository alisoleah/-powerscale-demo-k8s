---
- name: CONFIGURE SHARES AND QUOTAS - PowerScale
  hosts: all
  connection: local
  gather_facts: false

  vars:
    isilon_host: "{{ inventory_hostname }}"
    api_user: "{{ ansible_user | default('root') }}"
    api_password: "{{ ansible_password }}"
  # ---------------------------------------------------------------
  # DYNAMIC DEPENDENCY INSTALLATION
  # ---------------------------------------------------------------
  pre_tasks:
    - name: Ensure PowerScale Python SDK is installed in AWX runner
      ansible.builtin.pip:
        name: "isilon-sdk"
        state: present

  tasks:
    # ---------------------------------------------------------------
    # SMARTQUOTAS (5GB Limits)
    # ---------------------------------------------------------------
    - name: 1. Apply 5GB SmartQuota to Source (Site A)
      dellemc.powerscale.smartquota:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        quota_type: "directory"
        path: "/ifs/data/source"
        quota:
          hard_limit_size: 1
          cap_unit: "GB"
        state: "present"

    - name: 2. Apply 5GB SmartQuota to Target (Site B)
      dellemc.powerscale.smartquota:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        quota_type: "directory"
        path: "/ifs/data/target"
        quota:
          hard_limit_size: 1
          cap_unit: "GB"
        state: "present"
    # ---------------------------------------------------------------
    # NFS EXPORTS (For Linux/Kubernetes Clients)
    # ---------------------------------------------------------------
    - name: 3. Create Source NFS Export (Site A)
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "/ifs/data/source"
        description: "Primary Data Center NFS"
        state: "present"

    - name: 4. Create Target NFS Export (Site B)
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "/ifs/data/target"
        description: "Standby Data Center NFS (Read-Only until Failover)"
        state: "present"

    # ---------------------------------------------------------------
    # SMB SHARES (For Windows Clients)
    # ---------------------------------------------------------------
    - name: 5. Create Source SMB Share (Site A)
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        share_name: "Site_A_Primary"
        path: "/ifs/data/source"
        description: "Primary Windows Share"
        permissions:
          - permission: "full"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 6. Create Target SMB Share (Site B)
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        share_name: "Site_B_Recovery"
        path: "/ifs/data/target"
        description: "Standby Windows Share (Read-Only until Failover)"
        permissions:
          - permission: "full"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

