---
- name: EXECUTE FAILBACK & RESTORE - PowerScale SyncIQ
  hosts: all
  connection: local
  gather_facts: false

  vars:
    isilon_host: "{{ target_cluster | default(inventory_hostname) }}"
    policy_name: "{{ synciq_policy | default('NFS_Demo_Policy') }}"

  pre_tasks:
    - name: Ensure PowerScale Python SDK is installed in AWX runner
      ansible.builtin.pip:
        name: "isilon-sdk"
        state: present

  tasks:
    # ---------------------------------------------------------------
    # STEP 1: Enable policy in case it was auto-disabled
    # ---------------------------------------------------------------
    - name: 1. Enable SyncIQ policy
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        policy_name: "{{ policy_name }}"
        enabled: true
        state: "present"

    # ---------------------------------------------------------------
    # STEP 2: allow_write_revert — releases the SyncIQ domain lock on
    # the target path, restores source to writable and target to
    # read-only at the kernel level.
    # ---------------------------------------------------------------
    - name: 2. SyncIQ Allow Write Revert (restore original direction)
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        policy_name: "{{ policy_name }}"
        job_params:
          action: "allow_write_revert"
          wait_for_completion: true
        state: "present"
      register: revert_result

    - name: 2b. Confirm Allow Write Revert job was triggered
      ansible.builtin.debug:
        msg: "Allow Write Revert result: changed={{ revert_result.changed }} — job {{ 'WAS' if revert_result.changed else 'was NOT' }} triggered"

    - name: 2c. Fail if Allow Write Revert was silently skipped
      ansible.builtin.fail:
        msg: >
          allow_write_revert job was NOT created (task returned ok with no change).
          This is a known module idempotency issue. Check the SyncIQ policy
          state and re-run, or run manually:
          isi sync jobs create {{ policy_name }} --action allow_write_revert
      when: not revert_result.changed

    # ---------------------------------------------------------------
    # STEP 3: Set NFS + SMB permissions to match restored state
    # Done AFTER allow_write_revert so domain lock is already released
    # ---------------------------------------------------------------
    - name: 3a. Un-Fence Site A - Restore SMB Share to Full Write
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_A_Primary"
        path: "/ifs/data/source"
        description: "Primary Windows Share (Active)"
        permissions:
          - permission: "full"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 3b. Un-Fence Site A - Restore NFS Export to Read-Write
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/source"
        access_zone: "System"
        read_only: false
        root_clients:
          - "172.27.96.0/20"
        state: "present"

    - name: 4a. Fence Site B - Lock SMB Share to Read-Only
      dellemc.powerscale.smb:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        share_name: "Site_B_Recovery"
        path: "/ifs/data/target"
        description: "Standby Windows Share (Read-Only until Failover)"
        permissions:
          - permission: "read"
            permission_type: "allow"
            trustee:
              type: "wellknown"
              name: "Everyone"
        state: "present"

    - name: 4b. Fence Site B - Lock NFS Export to Read-Only
      dellemc.powerscale.nfs:
        onefs_host: "{{ isilon_host }}"
        verify_ssl: false
        api_user: "{{ ansible_user | default('root') }}"
        api_password: "{{ ansible_password }}"
        path: "/ifs/data/target"
        access_zone: "System"
        read_only: true
        root_clients:
          - "172.27.96.0/20"
        state: "present"

    # ---------------------------------------------------------------
    # STEP 4: Final confirmation for demo audience
    # ---------------------------------------------------------------
    - name: 5. Confirm Failback Complete
      debug:
        msg:
          - "FAILBACK COMPLETE"
          - "Site A /ifs/data/source → READ-WRITE (Primary restored)"
          - "Site B /ifs/data/target → READ-ONLY  (Standby locked)"
          - "SyncIQ domain lock released — ready for next failover cycle"
